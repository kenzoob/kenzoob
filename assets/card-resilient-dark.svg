<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" xml:space="preserve" role="img" aria-label="resilient-llm: Keeps LLM calls working when a provider fails: retries, a circuit breaker, fallback and streaming.">
<title>resilient-llm: Keeps LLM calls working when a provider fails: retries, a circuit breaker, fallback and streaming.</title>
<style>
.ink{fill:#e6edf3}.muted{fill:#9198a1}.faint{fill:#656c76}
text{white-space:pre}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}

.box{fill:#151b23;stroke:#3d444d}
.st{stroke:#e6edf3;fill:none}
@keyframes m1{0%{transform:translate(0,0);opacity:0}5%{opacity:1}30%{transform:translate(64px,0)}44%{transform:translate(64px,0)}62%{transform:translate(64px,84px)}88%{transform:translate(150px,84px);opacity:1}94%,100%{transform:translate(150px,84px);opacity:0}}
.m1{animation:m1 3.6s ease-in-out infinite}
@keyframes x1{0%,28%{opacity:0}32%,90%{opacity:1}100%{opacity:0}}.x1{animation:x1 3.6s linear infinite}
@keyframes sw{0%,40%{transform:rotate(0)}48%,92%{transform:rotate(-38deg)}100%{transform:rotate(0)}}.sw{transform-box:view-box;transform-origin:36px 152px;animation:sw 3.6s ease-in-out infinite}
@keyframes ok{0%,84%{opacity:0}88%,96%{opacity:1}100%{opacity:0}}.okm{animation:ok 3.6s linear infinite}
@keyframes lane{0%,40%{opacity:1}48%,92%{opacity:.3}100%{opacity:1}}.lane{animation:lane 3.6s linear infinite}
</style>

<rect x="1" y="1" width="578" height="208" rx="14" class="box"/>
<rect x="28" y="60" width="44" height="3" rx="1.5" fill="#b083ff"/>
<text x="28" y="48" class="mono" fill="#b083ff" font-size="19">resilient-llm</text>
<text x="28" y="94" class="sans muted" font-size="15">Keeps LLM calls working when a</text><text x="28" y="116" class="sans muted" font-size="15">provider fails: retries, a circuit</text><text x="28" y="138" class="sans muted" font-size="15">breaker, fallback and streaming.</text>
<text x="28" y="182" class="mono faint" font-size="12">TypeScript · npm · no dependencies · 70 tests</text>
<g transform="translate(392,20)"><text x="0" y="22" class="mono faint" font-size="11">anthropic</text>
<line x1="0" y1="40" x2="170" y2="40" stroke="#3d444d" stroke-width="2" class="lane"/>
<text x="0" y="106" class="mono faint" font-size="11">openai</text>
<line x1="0" y1="124" x2="170" y2="124" stroke="#3fb950" stroke-opacity=".5" stroke-width="2"/>
<path d="M70 40 V124" stroke="#3d444d" stroke-dasharray="3 4"/>
<g class="x1" stroke="#f85149" stroke-width="2.5" stroke-linecap="round"><line x1="80" y1="30" x2="96" y2="50"/><line x1="96" y1="30" x2="80" y2="50"/></g>
<circle cx="6" cy="40" r="6.5" fill="#4f9dff" class="m1"/>
<text x="160" y="116" class="mono okm" font-size="14" fill="#3fb950">✓</text>
<circle cx="36" cy="152" r="3" fill="#e6edf3"/><circle cx="76" cy="152" r="3" fill="#e6edf3"/>
<line x1="36" y1="152" x2="76" y2="152" stroke="#b083ff" stroke-width="2.5" stroke-linecap="round" class="sw"/>
<text x="90" y="156" class="mono faint" font-size="11">breaker</text></g>

</svg>
