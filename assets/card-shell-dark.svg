<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" xml:space="preserve" role="img" aria-label="minishell: A UNIX shell written in C, inspired by tcsh: pipes, redirections, quotes, aliases and a parser built on an AST.">
<title>minishell: A UNIX shell written in C, inspired by tcsh: pipes, redirections, quotes, aliases and a parser built on an AST.</title>
<style>
.ink{fill:#e6edf3}.muted{fill:#9198a1}.faint{fill:#656c76}
text{white-space:pre}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}

.box{fill:#151b23;stroke:#3d444d}
.st{stroke:#e6edf3;fill:none}
