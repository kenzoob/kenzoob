</style>

<rect x="1" y="1" width="578" height="208" rx="14" class="box"/>
<rect x="28" y="60" width="44" height="3" rx="1.5" fill="#39d0d8"/>
<text x="28" y="48" class="mono" fill="#39d0d8" font-size="19">minishell</text>
<text x="28" y="94" class="sans muted" font-size="15">A UNIX shell written in C, inspired</text><text x="28" y="116" class="sans muted" font-size="15">by tcsh: pipes, redirections, quotes,</text><text x="28" y="138" class="sans muted" font-size="15">aliases and a parser built on an AST.</text>
<text x="28" y="182" class="mono faint" font-size="12">C · POSIX · fork / exec</text>
