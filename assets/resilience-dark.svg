<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" xml:space="preserve" role="img" aria-label="Animation : resilient-llm réessaie, puis bascule vers un autre fournisseur">
<title>Animation : resilient-llm réessaie, puis bascule vers un autre fournisseur</title>
<style>
.ink{fill:#e6edf3}.muted{fill:#9198a1}.faint{fill:#656c76}
text{white-space:pre}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}

.box{fill:#151b23;stroke:#3d444d;stroke-width:1.2}
.wire{stroke:#3d444d;stroke-width:1.5;fill:none}
.wire.d{stroke-dasharray:5 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-10}}
.ko{fill:#f85149}.ok{fill:#3fb950}
@keyframes p1{0%,1.99%{opacity:0;transform:translate(0,0)}2%{opacity:1;transform:translate(0,0)}8%{opacity:1;transform:translate(190px,0px)}8.01%,100%{opacity:0;transform:translate(190px,0px)}}#p1{animation:p1 12s linear infinite}
@keyframes p2{0%,8.99%{opacity:0;transform:translate(0,0)}9%{opacity:1;transform:translate(0,0)}15%{opacity:1;transform:translate(210px,-65px)}15.01%,100%{opacity:0;transform:translate(210px,-65px)}}#p2{animation:p2 12s linear infinite}
@keyframes p3{0%,26.99%{opacity:0;transform:translate(0,0)}27%{opacity:1;transform:translate(0,0)}33%{opacity:1;transform:translate(210px,-65px)}33.01%,100%{opacity:0;transform:translate(210px,-65px)}}#p3{animation:p3 12s linear infinite}
@keyframes p4{0%,43.99%{opacity:0;transform:translate(0,0)}44%{opacity:1;transform:translate(0,0)}50%{opacity:1;transform:translate(210px,-65px)}50.01%,100%{opacity:0;transform:translate(210px,-65px)}}#p4{animation:p4 12s linear infinite}
@keyframes p5{0%,57.99%{opacity:0;transform:translate(0,0)}58%{opacity:1;transform:translate(0,0)}64%{opacity:1;transform:translate(210px,65px)}64.01%,100%{opacity:0;transform:translate(210px,65px)}}#p5{animation:p5 12s linear infinite}
@keyframes p6{0%,66.99%{opacity:0;transform:translate(0,0)}67%{opacity:1;transform:translate(0,0)}73%{opacity:1;transform:translate(-210px,-65px)}73.01%,100%{opacity:0;transform:translate(-210px,-65px)}}#p6{animation:p6 12s linear infinite}
@keyframes p7{0%,73.99%{opacity:0;transform:translate(0,0)}74%{opacity:1;transform:translate(0,0)}80%{opacity:1;transform:translate(-190px,0px)}80.01%,100%{opacity:0;transform:translate(-190px,0px)}}#p7{animation:p7 12s linear infinite}
@keyframes b1{0%,14.99%{opacity:0}15%,24%{opacity:1}24.01%,100%{opacity:0}}.b1{opacity:0;animation:b1 12s linear infinite}@keyframes b2{0%,32.99%{opacity:0}33%,41%{opacity:1}41.01%,100%{opacity:0}}.b2{opacity:0;animation:b2 12s linear infinite}@keyframes b3{0%,49.99%{opacity:0}50%,57%{opacity:1}57.01%,100%{opacity:0}}.b3{opacity:0;animation:b3 12s linear infinite}@keyframes b4{0%,63.99%{opacity:0}64%,96%{opacity:1}96.01%,100%{opacity:0}}.b4{opacity:0;animation:b4 12s linear infinite}
@keyframes l1{0%,15.99%{opacity:0}16%,96%{opacity:1}96.01%,100%{opacity:0}}.l1{opacity:0;animation:l1 12s linear infinite}@keyframes l2{0%,33.99%{opacity:0}34%,96%{opacity:1}96.01%,100%{opacity:0}}.l2{opacity:0;animation:l2 12s linear infinite}@keyframes l3{0%,50.99%{opacity:0}51%,96%{opacity:1}96.01%,100%{opacity:0}}.l3{opacity:0;animation:l3 12s linear infinite}@keyframes l4{0%,64.99%{opacity:0}65%,96%{opacity:1}96.01%,100%{opacity:0}}.l4{opacity:0;animation:l4 12s linear infinite}
@keyframes f0{0%,-0.01%{opacity:0}0%,15%{opacity:1}15.01%,100%{opacity:0}}.f0{opacity:0;animation:f0 12s linear infinite}@keyframes f1{0%,15%{opacity:0}15.01%,33%{opacity:1}33.01%,100%{opacity:0}}.f1{opacity:0;animation:f1 12s linear infinite}@keyframes f2{0%,33%{opacity:0}33.01%,50%{opacity:1}50.01%,100%{opacity:0}}.f2{opacity:0;animation:f2 12s linear infinite}@keyframes f3{0%,50%{opacity:0}50.01%,96%{opacity:1}96.01%,100%{opacity:0}}.f3{opacity:0;animation:f3 12s linear infinite}
@keyframes done{0%,79.99%{opacity:0}80%,96%{opacity:1}96.01%,100%{opacity:0}}.done{opacity:0;animation:done 12s linear infinite}
@keyframes dim{0%,52%{opacity:1}54%,95%{opacity:.35}100%{opacity:1}}.dim{animation:dim 12s linear infinite}

</style>

<text x="60" y="44" class="mono faint" font-size="13">resilient-llm  ·  exemple avec retries: 2, failureThreshold: 5</text>
<text x="60" y="74" class="sans ink" font-size="21">Ce qui se passe quand Anthropic répond mal à ton appel</text>
<path d="M250 175H440" class="wire"/>
<path d="M710 175L920 110" class="wire"/>
<path d="M710 175L920 240" class="wire d"/>
<rect x="60" y="150" width="190" height="50" rx="10" class="box"/>
<text x="155" y="181" text-anchor="middle" class="mono ink" font-size="15">ton app</text>
<text x="155" y="226" text-anchor="middle" class="mono done" font-size="13" fill="#3fb950">✓ réponse reçue</text>
<rect x="440" y="140" width="270" height="70" rx="12" class="box"/>
<text x="575" y="170" text-anchor="middle" class="mono ink" font-size="16">resilient-llm</text>
<g class="mono faint" font-size="12" text-anchor="middle">
<text x="575" y="193" class="f0">échecs : 0/5   circuit fermé</text>
<text x="575" y="193" class="f1">échecs : 1/5   circuit fermé</text>
<text x="575" y="193" class="f2">échecs : 2/5   circuit fermé</text>
<text x="575" y="193" class="f3">échecs : 3/5   on bascule</text>
</g>
<g class="dim"><rect x="920" y="85" width="220" height="50" rx="10" class="box"/>
<text x="942" y="115" class="mono ink" font-size="15">Anthropic</text></g>
<g class="b1"><rect x="1076" y="100" width="52" height="22" rx="11" fill="none" stroke="#f85149"/><text x="1102" y="116" text-anchor="middle" class="mono" font-size="13" fill="#f85149">429</text></g><g class="b2"><rect x="1076" y="100" width="52" height="22" rx="11" fill="none" stroke="#f85149"/><text x="1102" y="116" text-anchor="middle" class="mono" font-size="13" fill="#f85149">503</text></g><g class="b3"><rect x="1076" y="100" width="52" height="22" rx="11" fill="none" stroke="#f85149"/><text x="1102" y="116" text-anchor="middle" class="mono" font-size="13" fill="#f85149">503</text></g>
<rect x="920" y="215" width="220" height="50" rx="10" class="box"/>
<text x="942" y="245" class="mono ink" font-size="15">OpenAI</text>
<g class="b4"><rect x="1076" y="230" width="52" height="22" rx="11" fill="none" stroke="#3fb950"/><text x="1102" y="246" text-anchor="middle" class="mono" font-size="13" fill="#3fb950">200</text></g>
<circle id="p1" cx="250" cy="175" r="6" fill="#e6edf3"/><circle id="p2" cx="710" cy="175" r="6" fill="#e6edf3"/><circle id="p3" cx="710" cy="175" r="6" fill="#e6edf3"/><circle id="p4" cx="710" cy="175" r="6" fill="#e6edf3"/><circle id="p5" cx="710" cy="175" r="6" fill="#e6edf3"/><circle id="p6" cx="920" cy="240" r="6" fill="#e6edf3"/><circle id="p7" cx="440" cy="175" r="6" fill="#e6edf3"/>
<line x1="60" y1="290" x2="1140" y2="290" stroke="#3d444d"/>
<text y="322" class="mono l1" font-size="13"><tspan x="60" class="muted">→ anthropic</tspan><tspan x="200" fill="#f85149">429</tspan><tspan x="250" class="faint">essai 1</tspan><tspan x="340" class="ink">on attend ≈ 500 ms, puis on réessaie</tspan></text>
<text y="346" class="mono l2" font-size="13"><tspan x="60" class="muted">→ anthropic</tspan><tspan x="200" fill="#f85149">503</tspan><tspan x="250" class="faint">essai 2</tspan><tspan x="340" class="ink">on attend ≈ 1 s</tspan></text>
<text y="370" class="mono l3" font-size="13"><tspan x="60" class="muted">→ anthropic</tspan><tspan x="200" fill="#f85149">503</tspan><tspan x="250" class="faint">essai 3</tspan><tspan x="340" class="ink">plus d’essai : on passe au fournisseur suivant</tspan></text>
<text y="394" class="mono l4" font-size="13"><tspan x="60" class="muted">→ openai</tspan><tspan x="200" fill="#3fb950">200</tspan><tspan x="250" class="faint">ok</tspan><tspan x="340" class="ink">la réponse revient à l’app, sans que l’app ait rien vu</tspan></text>

</svg>
