<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" xml:space="preserve" role="img" aria-label="github-triage-mcp: An MCP server that triages GitHub issues without handing the AI the keys to the repo. Four safety layers.">
<title>github-triage-mcp: An MCP server that triages GitHub issues without handing the AI the keys to the repo. Four safety layers.</title>
<style>
.ink{fill:#e6edf3}.muted{fill:#9198a1}.faint{fill:#656c76}
text{white-space:pre}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}

.box{fill:#151b23;stroke:#3d444d}
.st{stroke:#e6edf3;fill:none}
.ly{stroke-width:2;opacity:.25;animation:ly 5s ease-in-out infinite}@keyframes ly{0%,4%{opacity:.2}8%,14%{opacity:1}22%,100%{opacity:.2}}
.good{animation:good 5s ease-in-out infinite}@keyframes good{0%{transform:translateY(0);opacity:0}4%{opacity:1}30%{transform:translateY(89px);opacity:1}40%,100%{transform:translateY(89px);opacity:0}}
.core{transform-box:fill-box;transform-origin:center;animation:core 5s ease-out infinite}@keyframes core{0%,28%{transform:scale(1);opacity:.4}34%{transform:scale(1.6);opacity:1}46%,100%{transform:scale(1);opacity:.4}}
.bad{animation:bad 5s ease-in infinite}@keyframes bad{0%,52%{transform:translateY(0);opacity:0}56%{opacity:1}66%{transform:translateY(-12px);opacity:1}78%,100%{transform:translateY(-12px);opacity:0}}
.hit{opacity:0;animation:hit 5s linear infinite}@keyframes hit{0%,65%{opacity:0}67%{opacity:.5}80%,100%{opacity:0}}
</style>

<rect x="1" y="1" width="578" height="208" rx="14" class="box"/>
<rect x="28" y="60" width="44" height="3" rx="1.5" fill="#4f9dff"/>
<text x="28" y="48" class="mono" fill="#4f9dff" font-size="19">github-triage-mcp</text>
<text x="28" y="94" class="sans muted" font-size="15">An MCP server that triages GitHub</text><text x="28" y="116" class="sans muted" font-size="15">issues without handing the AI the</text><text x="28" y="138" class="sans muted" font-size="15">keys to the repo. Four safety layers.</text>
<text x="28" y="182" class="mono faint" font-size="12">MCP · TypeScript · read-only by default</text>
<g transform="translate(392,20)"><rect x="10" y="0" width="150" height="150" rx="12" class="ly" style="stroke:#b083ff;fill:none;animation-delay:0.25s"/><rect x="25" y="15" width="120" height="120" rx="10" class="ly" style="stroke:#4f9dff;fill:none;animation-delay:0.47s"/><rect x="40" y="30" width="90" height="90" rx="8" class="ly" style="stroke:#39d0d8;fill:none;animation-delay:0.69s"/><rect x="55" y="45" width="60" height="60" rx="6" class="ly" style="stroke:#3fb950;fill:none;animation-delay:0.91s"/><circle cx="85" cy="75" r="9" fill="#3fb950" fill-opacity=".25" stroke="#3fb950" stroke-width="2" class="core"/><circle cx="85" cy="-14" r="5" fill="#39d0d8" class="good"/><circle cx="85" cy="168" r="5" fill="#f85149" class="bad"/><rect x="40" y="146" width="90" height="8" rx="4" fill="#f85149" class="hit"/></g>

</svg>
